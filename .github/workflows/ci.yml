name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 밀면 앞선 실행을 접는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: 하네스 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 하네스는 표준 라이브러리만 쓴다. 설치할 것이 없다.
      - name: 테스트
        working-directory: parity-harness
        run: python -m unittest discover -s tests -t . -v

  gates:
    name: 정합성 게이트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 정답 재생산 + 메뉴 정합성 + 발명 차단.
      # exit code 규약을 그대로 쓴다 — 3(ESCALATE)도 실패로 취급한다.
      # 정답이 없거나 낡았는데 통과시키는 것이 가장 나쁜 실패다.
      - name: 게이트
        run: python migration/tools/run_gates.py

  app:
    name: 앱 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 컴파일 + Checkstyle + 테스트.
      # DB 를 상대로 하는 테스트는 application-local.yml 이 없어 스스로 건너뛴다
      # (접속 정보는 커밋하지 않는다).
      - name: 빌드
        working-directory: migration/app
        run: ./gradlew build --no-daemon

      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: migration/app/build/reports/tests/test
          if-no-files-found: ignore
