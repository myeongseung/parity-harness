/*
 * 레거시 ERFlow 를 WAR 로 묶는다.
 *
 * 왜 필요한가
 *   정합성 게이트는 템플릿 원본까지만 본다. CSS 가 깨졌는지, JS 가 죽었는지, 화면이
 *   실제로 같아 보이는지는 못 본다. 그것을 보려면 **레거시가 돌아야 한다** —
 *   비교할 대상이 있어야 비교가 성립한다.
 *
 * legacy/ 를 고치지 않는다
 *   레거시는 정답이다. 소스를 건드리면 판정 기준이 흔들린다. 그래서 원본을 읽어
 *   build/patched-src 로 복사하면서 DB 접속 자리표시자만 채운다. 원본은 그대로다.
 *
 * 접속 정보는 환경변수로 받는다. 소스에도 이 파일에도 적지 않는다.
 */
plugins {
    id 'war'
}

// 레거시는 Eclipse Dynamic Web Project 였다 (Java 17 / Tomcat 9 / javax.servlet).
//
// 여기서는 21 로 컴파일한다. 신규 앱과 같은 JDK 를 쓰면 설치를 하나만 두면 되고,
// Tomcat 9 도 21 위에서 돈다. 레거시 코드는 17 문법을 넘지 않으므로 결과가 같다.
// 이 프로젝트에서 레거시는 *비교 대상*이지 운영 배포물이 아니다.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    legacyRoot = file("${rootDir}/../../legacy/ERFlow/src/main")
    patchedSrc = layout.buildDirectory.dir('patched-src')
}

dependencies {
    // Tomcat 이 제공한다. WAR 에 넣으면 충돌한다.
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    providedCompile 'javax.servlet.jsp:javax.servlet.jsp-api:2.3.3'

    // 레거시가 실제로 쓰는 것만. WEB-INF/lib 이 비어 있어 import 로 찾아냈다.
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.sun.mail:javax.mail:1.6.2'
    implementation 'commons-fileupload:commons-fileupload:1.5'

    // 드라이버는 com.mysql.cj.jdbc.Driver 다. 서버는 MariaDB 지만 붙는다.
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'
}

/**
 * 원본을 복사하면서 DB 접속 자리표시자를 채운다.
 *
 * 레거시 DBConnectionServiceImpl 은 접속 정보를 소스에 박아 두고 자리표시자를
 * 남겨 뒀다. 그 세 줄만 바꾼다.
 */
tasks.register('patchSources', Copy) {
    description = '레거시 소스를 복사하며 DB 접속 정보를 주입한다'

    def dbUrl = System.getenv('ERFLOW_LEGACY_DB_URL')
    def dbUser = System.getenv('ERFLOW_LEGACY_DB_USER')
    def dbPassword = System.getenv('ERFLOW_LEGACY_DB_PASSWORD')

    // 주입 값을 입력으로 선언한다. 안 하면 소스가 그대로일 때 Gradle 이 이 태스크를
    // 건너뛰고, 접속 대상을 바꿨는데도 **예전 스키마를 보는 WAR** 가 나온다.
    // 그런 WAR 로 비교하면 무엇을 비교했는지 알 수 없다.
    inputs.property('dbUrl', dbUrl ?: '')
    inputs.property('dbUser', dbUser ?: '')

    doFirst {
        if (!dbUrl || !dbUser || dbPassword == null) {
            throw new GradleException(
                    '환경변수가 필요하다: ERFLOW_LEGACY_DB_URL, ERFLOW_LEGACY_DB_USER, ' +
                    'ERFLOW_LEGACY_DB_PASSWORD')
        }
    }

    from("${legacyRoot}/java")
    into(patchedSrc)
    filter { line ->
        line.replace('[YOUR_DB_REPOSITORY]', dbUrl)
            .replace('[YOUR_USER_ID]', dbUser)
            .replace('[YOUR_PASSWORD]', dbPassword)
    }
}

sourceSets {
    main {
        java {
            srcDirs = [patchedSrc]
        }
        resources {
            srcDirs = []
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'patchSources'
    options.encoding = 'UTF-8'
    // 레거시 코드에는 경고가 많다. 지금 고칠 것이 아니므로 조용히 넘긴다.
    options.compilerArgs << '-nowarn'
}

war {
    archiveFileName = 'ERFlow.war'
    from("${legacyRoot}/webapp") {
        exclude 'WEB-INF/**'
    }
    webXml = file("${legacyRoot}/webapp/WEB-INF/web.xml")
}

/*
 * ── 통(Tomcat) ────────────────────────────────────────────────────────────
 *
 * WAR 를 만드는 것과 그것을 **띄우는 것**은 다른 일이다. WAR 는 Gradle 만 있으면
 * 나오지만 올릴 통은 따로 받아야 하고, 통은 14MB 짜리 바이너리라 git 에 들어가지
 * 않는다. 그래서 새로 받은 작업 공간에서는 언제나 같은 자리에서 막힌다 —
 * "레거시를 띄우자" 가 "먼저 Tomcat 을 받으세요" 가 되는 자리다.
 *
 * 그 자리를 없앤다. `./gradlew deployLegacy` 하나면 통을 받고, 포트를 옮기고,
 * WAR 를 올리는 데까지 간다.
 */
ext {
    // Tomcat 9 다. 레거시가 javax.servlet 을 쓰므로 10 이상으로는 못 올린다
    // (10 부터 jakarta.servlet 이다).
    tomcatVersion = '9.0.107'
    tomcatHome = file("${projectDir}/tomcat")

    // 신규 앱이 18080 을 쓴다. 겹치지 않게 옮긴다.
    legacyPorts = ['8005': '19005', '8080': '19090', '8009': '19009']
}

tasks.register('fetchTomcat') {
    description = 'Tomcat 9 를 받아 legacy-runtime/tomcat 에 자리를 잡는다'

    def home = tomcatHome
    def version = tomcatVersion
    def ports = legacyPorts
    def archive = layout.buildDirectory.file("apache-tomcat-${version}.zip").get().asFile
    def unpacked = layout.buildDirectory.dir('tomcat-unpacked').get().asFile

    // 자리를 잡았는지는 **폴더가 있는지가 아니라 conf/server.xml 이 있는지**로 본다.
    // 폴더 유무로 보면 한 번 실패해 빈 폴더가 남았을 때 영영 건너뛴다.
    def serverXml = new File(home, 'conf/server.xml')
    onlyIf { !serverXml.exists() }

    doLast {
        archive.parentFile.mkdirs()
        ant.get(
                src: "https://archive.apache.org/dist/tomcat/tomcat-9/v${version}/bin/" +
                        "apache-tomcat-${version}-windows-x64.zip",
                dest: archive,
                skipexisting: true)

        delete(unpacked)
        copy {
            from zipTree(archive)
            into unpacked
        }
        // zip 안에 apache-tomcat-<버전>/ 한 겹이 더 있다. 그 안을 꺼내 온다.
        //
        // File.renameTo 를 쓰지 않는다. 실패해도 예외를 던지지 않고 false 만
        // 돌려주는데, 이미 있는 폴더 위로 옮기려 하면 Windows 에서 그냥 실패한다 —
        // 실제로 그렇게 빈 tomcat/ 만 남고 원본은 지워졌다.
        def inner = unpacked.listFiles().find { it.directory }
        copy {
            from inner
            into home
        }
        delete(unpacked)

        if (!serverXml.exists()) {
            throw new GradleException("Tomcat 을 펴지 못했다: ${home} 이 비어 있다")
        }

        // 포트를 옮긴다. 안 옮기면 8080 에서 신규 앱과 부딪힌다.
        def text = serverXml.getText('UTF-8')
        ports.each { from, to -> text = text.replace("port=\"${from}\"", "port=\"${to}\"") }
        serverXml.write(text, 'UTF-8')

        // 압축을 풀면 실행 권한이 날아간다. 리눅스·맥에서 catalina.sh 가 안 돈다.
        fileTree("${home}/bin") { include '*.sh' }.each { it.setExecutable(true) }

        logger.lifecycle("Tomcat ${version} 준비 완료: ${home}")
    }
}

tasks.register('deployLegacy', Copy) {
    description = 'WAR 를 만들어 Tomcat 에 올린다'
    dependsOn 'war', 'fetchTomcat'

    from tasks.named('war')
    into "${tomcatHome}/webapps"

    doLast {
        logger.lifecycle('')
        logger.lifecycle('띄우기:')
        logger.lifecycle("  CATALINA_HOME=${tomcatHome} \\")
        logger.lifecycle("  ${tomcatHome}/bin/catalina.bat run")
        logger.lifecycle('')
        logger.lifecycle('  레거시  http://localhost:19090/ERFlow/login/login.jsp')
        logger.lifecycle('  신규    http://localhost:18080/login')
    }
}
