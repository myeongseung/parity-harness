spring:
  application:
    name: erflow

  datasource:
    url: ${ERFLOW_DB_URL:jdbc:mariadb://localhost:3306/erflow}
    username: ${ERFLOW_DB_USER:erflow}
    password: ${ERFLOW_DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver

  thymeleaf:
    # 레거시 화면을 1:1 로 옮기는 중에는 캐시가 켜져 있으면 확인이 느려진다.
    cache: false

mybatis:
  # 애너테이션 SQL 을 쓰지 않고 XML 매퍼로 모은다.
  # 이관한 SQL 이 레거시의 어느 쿼리에서 왔는지 한곳에서 대조할 수 있어야 한다.
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.erflow
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

server:
  port: ${ERFLOW_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    com.erflow: DEBUG
