<!--/*
  공통 <head>.

  **CSS 목록과 순서는 화면마다 다르다.** 레거시가 화면마다 손으로 적었고 56가지 조합이
  있다 — 같은 파일을 두 번 싣는 화면도, `bootstrap2.css` 라는 다른 파일을 쓰는 화면도
  있다. 나중에 실은 것이 이기므로 순서가 곧 화면이다.

  그래서 여기서 고정 목록을 갖지 않는다. 화면이 **자기 목록을 통째로** 넘긴다.
  CDN 도 그 목록에 들어간다 — 글꼴 아이콘(font-awesome)이 놓인 자리가 화면마다 다르다.

    sheets   예: ['/css/common/common.css', 'https://.../all.min.css', ...]
    pageJs   예: ['/js/main/unitList.js']

  한때 이 조각이 다섯 개를 고정으로 싣고 화면은 뒤에 덧붙이기만 했다. 87화면 중
  76화면의 순서가 어긋났고 실화면에서 배치 차이로 드러났다(D-093).
  `check_stylesheets.py` 가 화면마다 목록과 순서를 견준다.
*/-->
<head th:fragment="head(title, sheets, pageJs)" xmlns:th="http://www.thymeleaf.org">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--/*
      JSON 을 보내는 ajax 가 실어 보낼 CSRF 토큰. form 은 Thymeleaf 가 알아서
      hidden 입력을 넣지만 ajax 는 form 이 아니다(D-086).
    */-->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <title th:text="${title}">ERFlow</title>

    <script src="https://code.jquery.com/jquery-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.9.2/umd/popper.min.js"
            integrity="sha512-2rNj2KJ+D8s1ceNasTIex6z4HWyOnEYLVC3FigGOmyQCZc2eBXKgOxQmo3oKLHyfcj53uz4QMsRCWNbLd32Q1g=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" th:each="css : ${sheets}" th:href="@{${css}}">

    <script th:src="@{/js/bootjs/bootstrap.js}"></script>
    <script th:src="@{/js/common/csrf.js}"></script>
    <script th:src="@{/js/main/index.js}"></script>
    <script th:each="js : ${pageJs}" th:src="@{${js}}"></script>
</head>
