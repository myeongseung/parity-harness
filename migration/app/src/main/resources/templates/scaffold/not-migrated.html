<!DOCTYPE html>
<!--/*
  이관되지 않은 화면 안내.

  이것은 레거시 화면의 이관물이 **아니다.** 대응하는 golden 도 없고 정합성 게이트의
  대상도 아니다. index.jsp / admin.jsp 가 아직 이관 전이라 로그인 직후 갈 곳이 없어서
  임시로 두는 발판이며, 해당 도메인을 이관할 때 지운다.

  이관물처럼 보이지 않도록 레거시 디자인을 쓰지 않는다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이관 전 화면</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #333; line-height: 1.7; }
        .tag { display: inline-block; padding: .15rem .5rem; border: 1px solid #999;
               border-radius: .2rem; font-size: .8rem; color: #666; }
        code { background: #f4f4f4; padding: .1rem .3rem; }
        ul { padding-left: 1.2rem; }
    </style>
</head>
<body>
<p class="tag">이관 전</p>
<h1 th:text="${screenName}">화면</h1>
<p>이 화면은 아직 옮기지 않았다. 해당 도메인을 이관할 때 실제 화면으로 바뀐다.</p>

<h2>지금 볼 수 있는 화면</h2>
<ul>
    <li><a th:href="@{/unit/list}">생산 설비 관리</a> <code>/unit/list</code></li>
</ul>

<!--/* 로그아웃은 레거시대로 링크(GET)다. D-055 */-->
<p><a th:href="@{/login/logout-proc}">로그아웃</a></p>
</body>
</html>
